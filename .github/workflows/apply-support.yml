name: Apply the MeasureT tip jar

# One dispatch, and MeasureT's Settings screen offers the same five Stripe Payment Links that
# SideCut's Donate tab does.
#
# index.html and app.js are the app - there is no build here, the phone loads both straight off
# the branch - so the change travels as a patcher: dev/patch-support.py holds the anchors and the
# new text, and this runs it against the checked-out tree.
#
# A push to main IS the release. The page is a service worker away from every installed copy, so
# the version, the changelog head and updates.json all have to agree in the same commit: node
# dev/ota.mjs republishes updates.json and stamps sw.js and package.json from APP_VERSION, and its
# --check fails the run if any of the four disagree.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: measuret-support
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply the tip jar
        run: |
          set -euo pipefail
          python3 dev/patch-support.py
          python3 dev/patch-support.py --check

      - name: Publish the OTA manifest for this version
        run: |
          set -euo pipefail
          node dev/ota.mjs
          node dev/ota.mjs --check
          node -p "JSON.stringify(require('./updates.json'), null, 1)"

      - name: Check both files parse
        run: |
          set -euo pipefail
          node --check app.js
          # The group the release is about, in the file that carries it.
          grep -c 'id="support-tips"' index.html
          test "$(grep -c 'buy.stripe.com' index.html)" -eq 5
          grep -c "var APP_VERSION = '1.1.2';" app.js

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html app.js sw.js updates.json package.json; then
            echo 'nothing to commit - the tree already carries the tip jar'
            exit 0
          fi
          git config user.name 'MeasureT release'
          git config user.email 'actions@github.com'
          git add index.html app.js sw.js updates.json package.json
          git status --porcelain
          # Exactly the files a release owns. A stray path here means the patch touched something
          # it should not have, and the run must fail rather than sweep it in.
          stray=$(git diff --cached --name-only | grep -vE '^(index\.html|app\.js|sw\.js|updates\.json|package\.json)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::unexpected path(s) in the release commit: $stray"
            exit 1
          fi
          git commit -m "MeasureT 1.1.2: Settings carries the tip jar"
          git push
          echo '--- landed ---'
          git log --oneline -1
