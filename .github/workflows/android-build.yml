name: Build Android (Capacitor) AAB + APK

# Builds MeasureT — the web app wrapped as a WebView Android app with Capacitor — entirely
# in CI, so no Android Studio is needed. Every run produces:
#
#   MeasureT-<version>-debug.apk   installable by hand (signed with the debug key)
#   MeasureT-<version>.aab         the Play Console upload (signed once the keystore
#                                  secrets below are set, unsigned until then)
#   MeasureT-<version>.apk         the signed release APK, only when signing is configured
#
# The android/ project is NOT committed: it is regenerated from the Capacitor template on
# every run, which is why each local edit lives in a patch-*.py step.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'manifest.json'
      - 'icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build MeasureT
    runs-on: ubuntu-latest

    env:
      # Optional repository secrets. With them, the release AAB/APK are signed with the
      # real upload keystore. Without them the AAB is still produced (unsigned) and the
      # debug APK is the installable file. Never printed, never committed.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # patch-version.py counts commits to derive a rising versionCode.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Stage the web app into www/
        run: |
          set -e
          rm -rf www
          mkdir -p www/icons
          cp index.html www/index.html
          if [ -f app.js ]; then cp app.js www/app.js; fi
          if [ -f sw.js ]; then cp sw.js www/sw.js; fi
          if [ -f manifest.json ]; then cp manifest.json www/manifest.json; fi
          cp -r icons/. www/icons/
          if [ -d .well-known ]; then mkdir -p www/.well-known && cp -r .well-known/. www/.well-known/; fi
          echo '--- staged ---'
          find www -type f | sort

      - name: Add the Android platform
        run: npx cap add android

      - name: Sync the web app into the Android project
        run: npx cap sync android

      - name: Declare the sensors the app uses
        run: python3 .github/workflows/patch-manifest.py

      - name: Give the build a version that rises
        run: python3 .github/workflows/patch-version.py

      - name: Wire in the upload keystore (only when the secrets are set)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: python3 .github/workflows/patch-signing.py

      - name: Build the installable debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Build the release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Build the signed release APK (only when the secrets are set)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Collect the AAB and the APK
        id: dist
        run: |
          set -e
          V="$(node -p "require('./package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/MeasureT-$V-debug.apk"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
          if [ -z "$AAB" ]; then
            echo '::error::no .aab was produced by bundleRelease'
            exit 1
          fi
          cp "$AAB" "dist/MeasureT-$V.aab"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/MeasureT-$V.apk"
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'signing: upload keystore in use'
          else
            echo 'signing: no keystore secret set, so the AAB is UNSIGNED and the debug APK is the installable file'
          fi
          echo '--- dist ---'
          ls -l dist

      - name: Upload the AAB and the APK
        uses: actions/upload-artifact@v4
        with:
          name: MeasureT-${{ steps.dist.outputs.version }}
          path: dist/*
          if-no-files-found: error
