name: Build Android (Capacitor) AAB + APK

# Builds MeasureT — the web app wrapped as a WebView Android app with Capacitor — entirely
# in CI, so no Android Studio is needed. Every run produces four files:
#
#   MeasureT-<version>-release.aab  THE PLAY UPLOAD: signed with the upload keystore
#   MeasureT-<version>-release.apk  the same build as an installable APK, signed
#   MeasureT-<version>-debug.apk    installable by hand (debug key), for local testing only
#   MeasureT-<version>-debug.aab    the debug bundle, for an internal track only
#
# The signed pair only appears when the keystore secrets below are set; a run that is
# supposed to sign but produces no signed files fails rather than shipping a debug build.
#
# The android/ project is NOT committed: it is regenerated from the Capacitor template on
# every run, which is why each local edit lives in a patch-*.py step.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'manifest.json'
      - 'icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build MeasureT
    runs-on: ubuntu-latest

    env:
      # Repository secrets holding the upload keystore. With them, the release AAB and APK
      # are signed with the real key. Without them the build still runs, but the signing
      # step below fails the run rather than hand over a bundle Play will not accept.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # patch-version.py counts commits to derive a rising versionCode.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Stage the web app into www/
        run: |
          set -e
          rm -rf www
          mkdir -p www/icons
          cp index.html www/index.html
          if [ -f app.js ]; then cp app.js www/app.js; fi
          if [ -f sw.js ]; then cp sw.js www/sw.js; fi
          if [ -f manifest.json ]; then cp manifest.json www/manifest.json; fi
          cp -r icons/. www/icons/
          if [ -d .well-known ]; then mkdir -p www/.well-known && cp -r .well-known/. www/.well-known/; fi
          echo '--- staged ---'
          find www -type f | sort

      - name: Add the Android platform
        run: npx cap add android

      - name: Sync the web app into the Android project
        run: npx cap sync android

      - name: Declare the sensors the app uses
        run: python3 .github/workflows/patch-manifest.py

      - name: Give the build a version that rises
        run: python3 .github/workflows/patch-version.py

      # Play refuses an upload below minSdkVersion 24, and from 31 August 2026 it refuses
      # an update that targets less than API 36. The template ships 23 / 35, so both are
      # raised here rather than in a committed android/ project that does not exist.
      - name: Meet Play's SDK requirements
        run: python3 .github/workflows/patch-sdk.py

      - name: Wire in the upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: python3 .github/workflows/patch-signing.py

      - name: Build the release AAB (the Play upload)
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: Build the signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Build the installable debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      # The debug bundle: the same code Play would receive from a debug build, for an internal
      # track. assemble* makes the APK, bundle* makes the AAB.
      - name: Build the debug AAB
        run: cd android && ./gradlew bundleDebug --no-daemon

      # Checks the artifact that was actually built, not the Gradle file that asked for it:
      # Play rejects the bundle, so a wrong value fails here instead of being handed over.
      - name: Confirm the build meets Play's SDK requirements
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "android sdk: $SDK"
          MIN=""
          TARGET=""
          VCODE=""
          ANALYZER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name apkanalyzer 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$ANALYZER" ]; then
            echo "reading with $ANALYZER"
            MIN="$("$ANALYZER" manifest min-sdk "$APK" 2>/dev/null | tr -dc '0-9' || true)"
            TARGET="$("$ANALYZER" manifest target-sdk "$APK" 2>/dev/null | tr -dc '0-9' || true)"
            VCODE="$("$ANALYZER" manifest version-code "$APK" 2>/dev/null | tr -dc '0-9' || true)"
          fi
          if [ -z "$MIN" ] || [ -z "$TARGET" ]; then
            AAPT2="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt2 2>/dev/null | sort -V | tail -n 1)"
            AAPT="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
            BADGING=""
            if [ -n "$AAPT2" ]; then BADGING="$("$AAPT2" dump badging "$APK" 2>&1 || true)"; fi
            if [ -z "$BADGING" ] && [ -n "$AAPT" ]; then BADGING="$("$AAPT" dump badging "$APK" 2>&1 || true)"; fi
            echo '--- badging, first lines ---'
            printf '%s\n' "$BADGING" | head -n 6
            MIN="$(printf '%s\n' "$BADGING" | sed -n "s/.*sdkVersion:'\([0-9]*\)'.*/\1/p" | head -n 1 || true)"
            TARGET="$(printf '%s\n' "$BADGING" | sed -n "s/.*targetSdkVersion:'\([0-9]*\)'.*/\1/p" | head -n 1 || true)"
            VCODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1 || true)"
          fi
          echo "versionCode=$VCODE minSdkVersion=$MIN targetSdkVersion=$TARGET"
          FAIL=0
          if [ -z "$MIN" ] || [ -z "$TARGET" ]; then
            echo '::warning::could not read the SDK levels out of the APK — patch-sdk.py printed the values it wrote, and Play will reject an upload that misses the floor'
          else
            if [ "$MIN" -lt 24 ]; then
              echo "::error::minSdkVersion $MIN is below Play's floor of 24"
              FAIL=1
            fi
            if [ "$TARGET" -lt 36 ]; then
              echo "::error::targetSdkVersion $TARGET is below Play's requirement of 36 for uploads after 2026-08-31"
              FAIL=1
            fi
          fi
          {
            echo '### SDK levels in this build'
            echo ''
            echo '| field | this build | Play requires |'
            echo '| --- | --- | --- |'
            echo "| versionCode | ${VCODE:-?} | higher than the last upload |"
            echo "| minSdkVersion | ${MIN:-unreadable} | 24 or higher |"
            echo "| targetSdkVersion | ${TARGET:-unreadable} | 36 or higher |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$FAIL"

      - name: Collect the APKs and the AABs
        id: dist
        run: |
          set -e
          V="$(node -p "require('./package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/MeasureT-$V-debug.apk"

          # Both bundles need naming to be checked: gradle writes neither into dist by itself.
          DAAB="$(find android/app/build/outputs/bundle/debug -name '*.aab' | head -n 1)"
          if [ -z "$DAAB" ]; then
            echo '::error::no debug .aab was produced by bundleDebug'
            ls -R android/app/build/outputs/bundle 2>/dev/null || true
            exit 1
          fi
          cp "$DAAB" "dist/MeasureT-$V-debug.aab"

          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
          if [ -z "$AAB" ]; then
            echo '::error::no .aab was produced by bundleRelease'
            ls -R android/app/build/outputs/bundle 2>/dev/null || true
            exit 1
          fi
          cp "$AAB" "dist/MeasureT-$V-release.aab"

          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/MeasureT-$V-release.apk"
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'signing: upload keystore in use'
          else
            echo 'signing: no keystore secret set, so the AAB is UNSIGNED'
          fi
          echo '--- dist ---'
          ls -l dist

      # Without the keystore the release AAB is unsigned, and Play rejects an unsigned
      # upload. Fail here instead of handing over a file that cannot be used.
      - name: Confirm the release files are signed with the upload key
        run: |
          set -e
          V="${{ steps.dist.outputs.version }}"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ ! -f "dist/MeasureT-$V-release.apk" ]; then
            echo "::error::no signed release APK in dist — the ANDROID_KEYSTORE_BASE64 secret (and the three related ones) must be set for the Play upload to be signed"
            ls -l dist
            exit 1
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK/build-tools"
            exit 1
          fi
          echo "--- certificate on MeasureT-$V-release.apk ---"
          "$APKSIGNER" verify --print-certs "dist/MeasureT-$V-release.apk" | sed -n '1,12p'
          echo "--- signature on MeasureT-$V-release.aab ---"
          jarsigner -verify -verbose:summary "dist/MeasureT-$V-release.aab" | tail -n 3

      - name: Upload the APKs and the AABs
        uses: actions/upload-artifact@v4
        with:
          name: MeasureT-${{ steps.dist.outputs.version }}
          path: dist/*
          if-no-files-found: error
