name: Apply the signing fix

# One-shot: runs dev/ship.py, commits what it changes and pushes. Both files delete themselves.
on:
  push:
    branches: [main]
    paths: ['dev/ship.py']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply, commit and push
        run: |
          set -e
          git config user.name "AnekTheGreat"
          git config user.email "166177289+AnekTheGreat@users.noreply.github.com"
          pip install --quiet pyyaml
          python3 dev/ship.py
          rm -f dev/ship.py .github/workflows/apply-signing.yml
          git add -A
          git commit -m "MeasureT: sign with MeasureT's own key, never SideCut's"
          git push origin HEAD:main
