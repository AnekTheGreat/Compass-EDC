name: Apply MeasureT 1.3.0 (time zones)

# One dispatch, and MeasureT's Convert tab has a clock.
#
# index.html and app.js are the app - there is no build in this repository, the phone loads
# both straight off the branch - and they have to land byte for byte, so the release travels
# as a patcher: dev/patch-130.py holds the anchors and the new text, and this runs it against
# the checked-out tree.
#
# A push to main IS the release here. The page is a service worker away from every installed
# copy, so the version, the changelog head and updates.json all have to agree in the same
# commit: node dev/ota.mjs republishes updates.json and stamps sw.js and package.json from
# APP_VERSION, and its --check fails the run if any of the four disagree.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: measuret-130
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply the release
        run: |
          set -euo pipefail
          python3 dev/patch-130.py
          python3 dev/patch-130.py --check

      - name: Publish the OTA manifest for this version
        run: |
          set -euo pipefail
          node dev/ota.mjs
          node dev/ota.mjs --check
          node -p "JSON.stringify(require('./updates.json'), null, 1)"

      - name: Commit and push
        run: |
          set -euo pipefail
          node --check app.js
          grep -c 'id="cov-tz-view"' index.html
          grep -c 'id="tz-search"' index.html
          grep -c 'id="cov-unit-card"' index.html
          grep -c 'TZ_PLACES' app.js
          grep -c 'function tzRender()' app.js
          grep -c 'tzInit();' app.js
          if git diff --quiet -- index.html app.js sw.js updates.json package.json PATCH_NOTES.md; then
            echo 'nothing to commit - the tree already carries 1.3.0'
            exit 0
          fi
          git config user.name 'MeasureT release'
          git config user.email 'actions@github.com'
          git add index.html app.js sw.js updates.json package.json PATCH_NOTES.md
          git status --porcelain
          stray=$(git diff --cached --name-only | grep -vE '^(index\.html|app\.js|sw\.js|updates\.json|package\.json|PATCH_NOTES\.md)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::unexpected path(s) in the release commit: $stray"
            exit 1
          fi
          git commit -m "MeasureT 1.3.0: a Time chip in Convert - what time it is anywhere, and the difference from yours"
          git push
          echo '--- landed ---'
          git log --oneline -1
