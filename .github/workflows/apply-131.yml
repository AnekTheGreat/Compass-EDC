name: Apply MeasureT 1.3.1 (updates that land)

# One dispatch, and the "v1.3.0 is available" loop is over.
#
# The host sends cache-control: max-age=600 on every file, and app.js - the file that carries
# APP_VERSION - was being asked for at an address the cache had already seen. The page came
# fresh, the script did not, so the app kept reporting the old version while the feed kept
# offering the new one. dev/patch-131.py stamps the script's address with the version, turns
# the service worker's cache off for every file, and reloads to a fresh address.
#
# A push to main IS the release. node dev/ota.mjs republishes updates.json and stamps sw.js
# and package.json from APP_VERSION; its --check fails the run if any of the four disagree.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: measuret-131
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply the release
        run: |
          set -euo pipefail
          python3 dev/patch-131.py
          python3 dev/patch-131.py --check

      - name: Publish the OTA manifest for this version
        run: |
          set -euo pipefail
          node dev/ota.mjs
          node dev/ota.mjs --check
          node -p "JSON.stringify(require('./updates.json'), null, 1)"

      - name: Check the app parses and the update path is wired
        run: |
          set -euo pipefail
          node --check app.js
          node --check sw.js
          grep -c 'src="app.js?v=1.3.1"' index.html
          grep -c 'id="btn-reload-page"' index.html
          grep -c 'function hardReload(version)' app.js
          grep -c 'function otaFetch()' app.js
          grep -c "var VER = CACHE.replace" sw.js
          # No plain reload may survive: it is the thing that landed back on the stale page.
          if grep -q 'location.reload()' app.js; then
            echo '::error::app.js still reloads the same address'
            exit 1
          fi
          # The six unit categories and the time-zone chip are untouched by this release.
          node -e "const s=require('fs').readFileSync('app.js','utf8');const m=s.match(/var CONVERTERS = \{[\s\S]*?\n\};/)[0];const n=(m.match(/^  [a-z]+:\{/gm)||[]).length;if(n!==6){console.error('CONVERTERS has '+n+' categories, expected 6');process.exit(1)};if(!/function tzRender\(\)/.test(s)){console.error('the time-zone chip is missing');process.exit(1)};console.log('six unit categories and the clock are intact')"

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html app.js sw.js updates.json package.json PATCH_NOTES.md; then
            echo 'nothing to commit - the tree already carries 1.3.1'
            exit 0
          fi
          git config user.name 'MeasureT release'
          git config user.email 'actions@github.com'
          git add index.html app.js sw.js updates.json package.json PATCH_NOTES.md
          git status --porcelain
          stray=$(git diff --cached --name-only | grep -vE '^(index\.html|app\.js|sw\.js|updates\.json|package\.json|PATCH_NOTES\.md)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::unexpected path(s) in the release commit: $stray"
            exit 1
          fi
          git commit -m "MeasureT 1.3.1: updates land - versioned script, no cached files, fresh-address reload"
          git push
          echo '--- landed ---'
          git log --oneline -1
